<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Chill Space</title>
	</head>

	<body>
		<h1>Chill Space</h1>
		<p>Plan hangouts with friends, share memories, and stay connected.</p>

		<h2>Upcoming plans</h2>
		<ul id="plans-list">
			<li>Movie night</li>
			<li>Food meetup</li>
		</ul>
		<h2>Suggest a hangout</h2>
		<form>
			<label for="idea">Hangout idea</label>
			<input id="idea" name="idea" type="text">
			<button type="submit">Add idea</button>
		</form>
		<h2>Hangout ideas</h2>
			<table>
				<thead>
					<tr>
						<th>Idea</th>
						<th>Intrested</th>
						<th>Your action</th>
					</tr>
				</thead>
				<tbody id="ideas-body">
					<tr>
						<td>Bowling</td>
						<td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;0</td>
						<td><button type="button">I'm intrested</button></td>
					</tr>
				</tbody>
			</table>

		<script src="./chillspace.js"></script>
	</body>
</html>
